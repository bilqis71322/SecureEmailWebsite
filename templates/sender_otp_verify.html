{% extends "layout.html" %}
{% block body %}
<div class="card">
    <h2>Verify Sender OTP</h2>
    <p>OTP sent to: {{ email }}</p>
    <form method="POST" action="{{ url_for('sender_verify_otp') }}">
        <label for="otp">Enter OTP:</label>
        <input type="text" name="otp" id="otp" required>
        <button type="submit">Verify</button>
    </form>
</div>
{% endblock %}
