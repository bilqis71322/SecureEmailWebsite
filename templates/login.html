{% extends "layout.html" %}
{% block content %}
<div class="container" style="max-width:400px;margin:auto;margin-top:40px;text-align:center;">
  <h2>Login (OTP)</h2>
  <p>Enter your email to receive a One-Time Password.</p>

  <form method="POST" action="{{ url_for('login') }}">
    <input type="email" name="email" placeholder="Enter your email"
           required style="padding:10px;width:100%;margin-bottom:15px;border-radius:5px;border:1px solid #ccc;">
    <button type="submit"
            style="padding:10px 20px;border:none;background-color:#007bff;color:white;border-radius:5px;cursor:pointer;">
      Send OTP
    </button>
  </form>
</div>
{% endblock %}
